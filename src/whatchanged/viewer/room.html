<script>

  if (navigator.userAgentData?.brands?.some((b) => b.brand === "Chromium")) document.documentElement.classList.add("refract");

<style>
  /* Glass, after Apple's Liquid Glass: a translucent fill over a blurred, saturated and slightly darkened backdrop,
     a bright rim along the top edge and a softer one at the bottom, a soft drop shadow. The darkening keeps white
     text above 4.5:1 even over the room's white walls. */
  :root {
    color-scheme: dark;
    --bg: #0b0b0c; --ink: #f6f7f9; --ink-2: rgba(246, 247, 249, 0.84);
    --amber: #ffc857; --seg: rgba(255, 200, 87, 0.92);
    --removed: #ff5a5a; --added: #4cd97b; --moved: #5aa9ff;
    --glass-fill: rgba(20, 22, 27, 0.6);
    --glass-sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.025) 42%, rgba(255, 255, 255, 0.04));
    --glass-filter: blur(22px) saturate(1.7) brightness(0.74);
    --rim: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -1px 0 rgba(255, 255, 255, 0.11), inset 0 0 0 1px rgba(255, 255, 255, 0.09);
    --glow: inset 0 16px 22px -18px rgba(255, 255, 255, 0.3);
    --drop: 0 14px 34px -12px rgba(0, 0, 0, 0.6), 0 2px 8px -2px rgba(0, 0, 0, 0.35);
    --fill-1: rgba(255, 255, 255, 0.07); --fill-2: rgba(255, 255, 255, 0.13);
    --r-panel: 22px; --r-row: 14px;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --t: 200ms;
    --font: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --dock-h: 60px;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root { --glass-fill: rgba(20, 22, 27, 0.9); } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
               font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
  button { appearance: none; border: 0; border-radius: 999px; padding: 6px 12px; background: transparent; color: inherit; font: inherit; cursor: pointer;
           transition: background-color var(--t) var(--ease), color var(--t) var(--ease), box-shadow var(--t) var(--ease), transform 150ms var(--ease); }
  button:hover { background: var(--fill-1); }
  button:active { transform: scale(0.97); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .glass { background: var(--glass-sheen), var(--glass-fill); box-shadow: var(--rim), var(--glow), var(--drop); border-radius: var(--r-panel);
           backdrop-filter: var(--glass-filter); -webkit-backdrop-filter: var(--glass-filter); }

  /* The 3D view fills the window; on a tall (phone) screen it sits on top and the panels go underneath. */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #stage canvas { display: block; touch-action: none; }
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; display: none; transform-origin: 50% 100%; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 600;
         line-height: 18px; white-space: nowrap; color: #111214;
         box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 0 rgba(0, 0, 0, 0.12), 0 2px 8px -2px rgba(0, 0, 0, 0.55); }
  .tag.change { font-size: 12.5px; line-height: 22px; padding: 0 9px; border-radius: 8px; }
  .tag.hot { outline: 2px solid #fff; outline-offset: 1px; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #loading div { display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 14px; border-radius: 999px; color: var(--ink-2); }
  #loading i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); border-top-color: var(--amber); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #stamp { position: absolute; left: 50%; top: 16px; transform: translate(-50%, -6px); padding: 7px 20px; border-radius: 999px; font-size: 16px; font-weight: 600;
           opacity: 0; transition: opacity var(--t) var(--ease), transform var(--t) var(--ease); pointer-events: none; }
  #stamp.on { opacity: 1; transform: translate(-50%, 0); }
  #note { position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100vw - 64px));
          padding: 7px 16px; border-radius: 999px; font-size: 13px; text-align: center; pointer-events: none; }
  #note:empty { display: none; }
  #pip { position: absolute; right: 16px; bottom: calc(var(--dock-h) + 28px); width: min(260px, 24vw); margin: 0; padding: 6px; border-radius: 18px; display: none; }
  #pip img { display: block; width: 100%; border-radius: 12px; }
  #pip figcaption { color: var(--ink-2); font-size: 11.5px; padding: 5px 6px 1px; font-variant-numeric: tabular-nums; }

  #side { position: fixed; top: 16px; left: 16px; width: min(352px, calc(100vw - 32px)); max-height: calc(100vh - var(--dock-h) - 48px);
          display: flex; flex-direction: column; gap: 10px; }
  #title { padding: 14px 18px 15px; flex: none; }
  #title h1 { margin: 0 0 4px; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
  #summary { margin: 0; font-size: 14px; }
  #how { margin: 6px 0 0; color: var(--ink-2); font-size: 12.5px; }
  .list { padding: 6px; overflow: auto; min-height: 0; flex: 0 1 auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) transparent; }
  .head, .list summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 12px; font-size: 13px; font-weight: 600; }
  .head button, .list summary::after { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--fill-1);
                                        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
  .head button:hover { background: var(--fill-2); }
  #objects[open] { max-height: 42vh; }
  .list summary { cursor: pointer; list-style: none; border-radius: var(--r-row); }
  .list summary::-webkit-details-marker { display: none; }
  .list summary::after { content: "Show"; }
  .list[open] summary::after { content: "Hide"; }
  .list summary:hover::after { background: var(--fill-2); }
  .row { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border-radius: var(--r-row); }
  .row:active { transform: none; }
  .row[aria-current="true"] { background: var(--fill-2); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), inset 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .row i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--c); transform: translateY(1px);
           box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 10px -1px var(--c); }
  .row .id { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .row .n { margin-left: auto; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* The dock: three pieces of glass floating over the room, the Play lens, the timeline and the switches. */
  #dock { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(880px, calc(100vw - 32px)); box-sizing: border-box;
          display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  #play { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 116px; height: 48px; padding: 0 20px 0 16px; font-size: 15px; font-weight: 600;
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0.07)), rgba(22, 24, 29, 0.5);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 0 rgba(255, 255, 255, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.14),
                      inset 0 10px 14px -10px rgba(255, 255, 255, 0.45), var(--drop);
          backdrop-filter: blur(10px) saturate(1.8) brightness(0.8); -webkit-backdrop-filter: blur(10px) saturate(1.8) brightness(0.8); }
  .refract #play { backdrop-filter: url(#lens) blur(3px) saturate(1.8) brightness(0.8); }
  #play svg { width: 18px; height: 18px; fill: currentColor; }
  #play .pause, #play.on .go { display: none; }
  #play.on .pause { display: inline; }
  #play:hover { background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06) 55%, rgba(255, 255, 255, 0.1)), rgba(22, 24, 29, 0.5); }
  #play.on { color: #1d1606; background: linear-gradient(180deg, rgba(255, 236, 190, 0.55), rgba(255, 200, 87, 0) 60%), rgba(255, 200, 87, 0.9);
             box-shadow: inset 0 1px 0 rgba(255, 246, 222, 0.9), inset 0 -1px 0 rgba(120, 80, 0, 0.25), 0 0 0 1px rgba(255, 200, 87, 0.35),
                         0 0 26px -2px rgba(255, 200, 87, 0.6), var(--drop); }
  #bar { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 14px; height: 48px; box-sizing: border-box; padding: 0 18px 0 14px; border-radius: 999px; }
  #track { flex: 1 1 auto; position: relative; display: flex; align-items: center; min-width: 90px; height: 48px; }
  #track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px;
                   background: rgba(0, 0, 0, 0.4); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 255, 255, 0.12); }
  #segs { position: absolute; left: 9px; right: 9px; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; pointer-events: none; }
  #track input { appearance: none; -webkit-appearance: none; position: relative; z-index: 1; flex: 1; min-width: 0; height: 48px; margin: 0;
                 background: transparent; cursor: pointer; border-radius: 999px; }
  #track input:focus-visible { outline-offset: -8px; }
  #track input::-webkit-slider-runnable-track { height: 6px; background: transparent; }
  #track input::-moz-range-track { height: 6px; background: transparent; }
  #track input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; border: 0;
    background: radial-gradient(circle at 50% 30%, #fff 0 35%, #e4e7ec 75%, #cdd2d9); box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.45); }
  #track input::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; border: 0;
    background: radial-gradient(circle at 50% 30%, #fff 0 35%, #e4e7ec 75%, #cdd2d9); box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.45); }
  #clock { flex: none; min-width: 92px; text-align: right; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  #tools { flex: none; display: flex; align-items: center; gap: 4px; height: 48px; box-sizing: border-box; padding: 0 6px; border-radius: 999px; }
  #tools:empty { display: none; }
  /* Before | After: a segmented control whose bright thumb slides to the state shown (--i of --n). */
  .seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; margin-right: 4px; border-radius: 999px;
         background: rgba(0, 0, 0, 0.28); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4), inset 0 -1px 0 rgba(255, 255, 255, 0.08); }
  .seg::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n, 2)); border-radius: 999px;
                 background: linear-gradient(180deg, #fff, #e6e9ee); transform: translateX(calc(var(--i, 0) * 100%)); transition: transform 240ms var(--ease);
                 box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.1), 0 2px 7px rgba(0, 0, 0, 0.4); }
  .seg button { position: relative; padding: 6px 15px; font-weight: 600; font-size: 13.5px; }
  .seg button[aria-pressed="true"] { color: #111317; background: none; }
  /* Objects, Video: small toggles with a light that is on when they are. */
  .toggle { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 7px 11px; font-size: 13.5px; font-weight: 500; }
  .toggle::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); transition: background-color var(--t), box-shadow var(--t); }
  .toggle[aria-pressed="true"]::before { background: var(--amber); box-shadow: 0 0 0 2px rgba(255, 200, 87, 0.22), 0 0 9px 1px rgba(255, 200, 87, 0.8); }

  @media (max-aspect-ratio: 1/1) {
    body { display: flex; flex-direction: column; height: 100dvh; background: radial-gradient(120% 60% at 50% 100%, #17191e, var(--bg)); }
    #stage { position: relative; inset: auto; flex: none; height: min(75vw, 56dvh); }
    #side { position: static; width: auto; max-height: none; flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px 12px 0; }
    #dock { position: static; transform: none; width: auto; margin: 10px 12px max(12px, env(safe-area-inset-bottom)); gap: 8px; }
    #play { height: 44px; min-width: 104px; padding: 0 16px 0 13px; }
    #bar { flex-basis: 150px; height: 44px; gap: 10px; padding: 0 14px 0 10px; }
    #track, #track input { height: 44px; }
    #clock { min-width: 0; font-size: 12px; }
    #tools { flex: 1 1 100%; justify-content: center; height: 44px; }
    .list, #objects[open] { flex: none; max-height: none; overflow: visible; }  /* the column scrolls, not each list */
    #note { position: static; transform: none; order: -1; flex-basis: 100%; width: auto; max-width: none; padding: 0 4px; border-radius: 0;
            background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--ink-2); font-size: 12px; }
    #pip { right: 8px; bottom: 8px; width: 36%; padding: 4px; border-radius: 14px; }
    #pip img { border-radius: 10px; }
    #stamp { top: 10px; font-size: 14px; }
    .glass, #play, .refract #play { backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { transition-duration: 0s !important; animation-duration: 0s !important; }
    #loading i { animation: none; }
  }
</style>

<script>const SCENE = /*SCENE*/null;</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.3.1/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { LineSegments2 } from "three/addons/lines/LineSegments2.js";
import { LineSegmentsGeometry } from "three/addons/lines/LineSegmentsGeometry.js";
import { LineMaterial } from "three/addons/lines/LineMaterial.js";
import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

const data = SCENE ?? await (await fetch("scene.json")).json();
const names = Object.keys(data.splats);
const LABEL = { A: "Before", B: "After", room: "Room" };
const label = (n) => LABEL[n] ?? n;
const params = new URLSearchParams(location.search);
const m = data.meta;
const { degToRad: rad, radToDeg: deg, clamp } = THREE.MathUtils;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((done) => setTimeout(done, ms));

// ---------------------------------------------------------------- the lens
// The camera only ever stands where the phone stood, with the phone's lens, so every picture is one the splat
// was trained to reproduce and stays sharp. A screen of another shape crops the lens's frame and never widens it;
// the crop leaves some spare angle ("slack") that a before/after view may use to face a change.
const TRAIN_FOV_Y = m.fov_y_deg ?? 60;
const TRAIN_ASPECT = m.image_wh ? m.image_wh[0] / m.image_wh[1] : 16 / 9;
const TRAIN_FOV_X = m.fov_x_deg ?? deg(2 * Math.atan(Math.tan(rad(TRAIN_FOV_Y) / 2) * TRAIN_ASPECT));
const GATE = m.gate ?? { R_m: 0.10, theta_deg: 5 };
const view = {};
function fitView(w, h) {
  view.aspect = w > 0 && h > 0 ? w / h : TRAIN_ASPECT;  // a hidden (0 x 0) page would otherwise get NaN for good
  view.fovY = Math.min(TRAIN_FOV_Y, deg(2 * Math.atan(Math.tan(rad(TRAIN_FOV_X) / 2) / view.aspect)));
  view.fovX = deg(2 * Math.atan(Math.tan(rad(view.fovY) / 2) * view.aspect));
  view.slackH = Math.max(0, (TRAIN_FOV_X - view.fovX) / 2);
  view.slackV = Math.max(0, (TRAIN_FOV_Y - view.fovY) / 2);
}
const stage = $("stage");
fitView(stage.clientWidth, stage.clientHeight);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
const camera = new THREE.PerspectiveCamera(view.fovY, view.aspect, 0.02, 200);
scene.add(new SparkRenderer({ renderer }));

// Splats stay in COLMAP's frame; one shared similarity puts every one of them Y-up, floor at 0.
const room = new THREE.Group();
room.matrixAutoUpdate = false;
room.matrix.fromArray(data.matrix);
scene.add(room);
const meshes = {};
for (const n of names) {
  meshes[n] = new SplatMesh({ url: data.splats[n] });
  room.add(meshes[n]);
}
const ready = Promise.all(names.map((n) => meshes[n].initialized)).then(() => $("loading").remove());

// ---------------------------------------------------------------- each video as a rail of filmed frames
// Every state keeps its own frames. A rail is split into segments wherever registration left a hole (a time
// gap, a jump or a sharp turn), so nothing ever interpolates across views the phone never had.
const Y = new THREE.Vector3(0, 1, 0), X = new THREE.Vector3(1, 0, 0);
const HOLE = { dt: 1.0, dp: 0.25, turn: 20 };
const CAP = rad(2);  // steadying may turn a frame at most this far from its filmed orientation
const forward = (q, out = new THREE.Vector3()) => out.set(0, 0, -1).applyQuaternion(q);
const angleDeg = (a, b) => deg(Math.acos(clamp(a.dot(b), -1, 1)));

function makeRail(n) {
  const cams = data.cameras[n];
  const p = cams.map((c) => new THREE.Vector3(...c.position));
  const qRaw = cams.map((c) => {
    const r = c.rotation;
    return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().set(
      r[0][0], r[0][1], r[0][2], 0, r[1][0], r[1][1], r[1][2], 0, r[2][0], r[2][1], r[2][2], 0, 0, 0, 0, 1)).normalize();
  });
  const f = qRaw.map((q) => forward(q));
  const t = cams.map((c, i) => c.t ?? i / 4);
  // Holes are judged against this video's own frame spacing: at 1 frame a second, keeping the sharpest frame

const V3 = (a) => new THREE.Vector3(...a);
const groups = {}, objectsOf = {};
for (const n of names) {
  const after = n !== names[0] || names.length === 1;  // the first of a pair is "before"
  const changes = new THREE.Group(), objects = new THREE.Group(), solidAt = [];
  for (const c of data.changes ?? []) {
    const col = CHANGE[c.type] ?? "#ffffff", text = `${c.id} ${c.label} · ${c.type}`;
    if (c.type === "moved") {
      const [now, then] = after ? [c.after, c.before] : [c.before, c.after];
      changes.add(boxMesh(now, col, STYLE.solid, c.id), boxMesh(then, col, STYLE.ghost), arrow(V3(c.before.centre), V3(c.after.centre), col));
      tag(text, now, col, changes, c.id, true);
      solidAt.push(now.centre);
    } else {
      const solid = (c.type === "removed") !== after;  // removed: solid before, ghost after; added: the reverse
      changes.add(boxMesh(c, col, solid ? STYLE.solid : STYLE.ghost, c.id));
      tag(text, c, col, changes, c.id, true);
      if (solid) solidAt.push(c.centre);
    }
  }
  objectsOf[n] = [];
  for (const o of (data.objects?.[n] ?? []).filter(keep)) {
    if (solidAt.some((p) => V3(p).distanceTo(V3(o.centre)) < 0.25)) continue;  // the change box already shows it
    // One shared object set: the same object has the same id (and key) in Before and After.
    const key = o.id ? `obj:${o.id}` : `${n}:${objectsOf[n].length}`, col = classColour[nameOf(o)];
    objects.add(boxMesh(o, col, STYLE.object, key));
    tag(nameOf(o), o, col, objects, key);
    objectsOf[n].push({ o, key, name: nameOf(o), colour: col });
  }
  scene.add(changes, objects);
  groups[n] = { changes, objects };
}
function measureTags() {  // label sizes for the overlap test; again once the web font has loaded
  for (const t of tags) { t.el.style.display = "block"; }
  for (const t of tags) { t.w = t.el.offsetWidth; t.h = t.el.offsetHeight; t.el.style.display = "none"; }
}
measureTags();
document.fonts?.ready.then(measureTags);

const hasObjects = names.some((n) => objectsOf[n].length);
let showObjects = hasObjects;
function applyBoxes() {
  for (const n of names) {
    groups[n].changes.visible = n === current;
    groups[n].objects.visible = n === current && showObjects;
  }
}
function toggleObjects() {
  if (!hasObjects) return;
  showObjects = !showObjects;
  document.querySelector("[data-objects]").setAttribute("aria-pressed", showObjects);
  applyBoxes();
}
if (hasObjects) button("Objects", { class: "toggle", "data-objects": "", "aria-pressed": showObjects, title: "Show the detected objects (O)" }, toggleObjects);

// Labels sit at each box's top centre, a little smaller further away. Object labels only within 6 m (3.5 m left
// most boxes of a corner view of a bedroom unnamed); nearer
// labels win, and one that would overlap a label already placed (or a panel) is skipped. Change labels always show.
let hot = { key: null, until: 0 };
const v3 = new THREE.Vector3(), placed = [], panels = ["title", "changes", "objects", "pip", "note", "dock"].map($);
const clash = (r) => placed.some((o) => r.x0 < o.x1 && r.x1 > o.x0 && r.y0 < o.y1 && r.y1 > o.y0);
function placeTags(now) {
  const W = stage.clientWidth, H = stage.clientHeight, shown = [], s0 = stage.getBoundingClientRect();
  const blocked = panels.filter((el) => el.getClientRects().length).map((el) => {
    const r = el.getBoundingClientRect();
    return { x0: r.left - s0.left, x1: r.right - s0.left, y0: r.top - s0.top, y1: r.bottom - s0.top };
  });
  for (const t of tags) {
    let on = t.group.visible;
    if (on) {
      const d = camera.position.distanceTo(t.at);
      v3.copy(t.at).applyMatrix4(camera.matrixWorldInverse);
      on = v3.z < -0.1 && (t.change || d < 6);
      if (on) v3.copy(t.at).project(camera);
      on &&= Math.abs(v3.x) < 1 && Math.abs(v3.y) < 1;
      if (on) shown.push({ t, d, x: ((v3.x + 1) / 2) * W, y: ((1 - v3.y) / 2) * H - 3, hot: t.key === hot.key && now < hot.until });
    }
    if (!on) t.el.style.display = "none";
  }
  shown.sort((a, b) => b.t.change - a.t.change || b.hot - a.hot || a.d - b.d);
  placed.length = 0;
  let panelsIn = false;
  for (const s of shown) {
    const { t, d } = s, k = clamp(Math.pow(1.8 / d, 0.35), 0.8, 1.15), w = t.w * k + 4, h = t.h * k + 2;
    const x = clamp(s.x, w / 2, Math.max(w / 2, W - w / 2));  // kept inside the view
    let y = Math.max(s.y, h), r = { x0: x - w / 2, x1: x + w / 2, y0: y - h, y1: y };  // not cut off at the top
    if (!t.change && !panelsIn) { placed.push(...blocked); panelsIn = true; }  // object labels also keep off the panels
    for (let up = 0; t.change && up < 4 && clash(r); up++) { y -= h; r = { ...r, y0: y - h, y1: y }; }
    if (!t.change && !s.hot && clash(r)) { t.el.style.display = "none"; continue; }
    placed.push(r);
    t.el.classList.toggle("hot", s.hot);
    t.el.style.display = "block";
    t.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%) scale(${k.toFixed(3)})`;
  }
}
// The picked object or change pulses for a few seconds.
function flash(key) { hot = { key, until: performance.now() + 3000 }; }
function pulse(now) {
  const on = now < hot.until, u = 0.5 + 0.5 * Math.sin(now / 120);
  for (const p of pulses) p.mat.linewidth = on && p.key === hot.key ? p.base + 3 * u : p.base;
}

// ---------------------------------------------------------------- the lists: what changed, and every object
const rows = {};
function select(key) { Object.entries(rows).forEach(([k, r]) => r.setAttribute("aria-current", k === key)); }
function row(parent, key, colour, parts, onclick) {
  const b = Object.assign(document.createElement("button"), { className: "row", onclick });
  b.innerHTML = `<i style="--c:${colour}"></i>`;
  for (const [cls, text] of parts) b.append(Object.assign(document.createElement("span"), { className: cls, textContent: text }));
  rows[key] = b;
  parent.append(b);
}
const centreOf = (c) => (c.type === "moved" ? V3(c.before.centre).lerp(V3(c.after.centre), 0.5) : V3(c.centre));
// A change, before and after, from the view both videos filmed closest to each other: go there, then blink
// Before / After three times each, ending on After.
async function goToChange(c) {
  select(c.id);
  const C = centreOf(c), [a, b] = names.length > 1 ? names : [names[0], names[0]];
  const size = c.type === "moved" ? [...c.after.size, V3(c.before.centre).distanceTo(V3(c.after.centre))] : c.size;
  const pair = pickPair(a, b, C, reach(size));
  if (!pair) { note(`${c.id}: no filmed view of this spot in both videos`, 4000); return true; }
  const mid = aim(midPose(a, pair.i, b, pair.j), C), n = current === b ? b : a;
  if (!(await travel(n, n === a ? pair.i : pair.j, mid))) return false;
  flash(c.id);
  if (a === b) return true;
  const apart = pair.d < 0.02 && pair.angle < 1 ? "from the same spot" : `${Math.round(pair.d * 100)} cm / ${Math.round(pair.angle)}° apart`;
  note(`${c.id} ${c.label}: Before and After filmed ${apart}`, 4000);
  const k = seq;
  for (const [x, s] of [a, b, a, b, a, b].entries()) {
    if (x) await sleep(1200);
    if (k !== seq) return false;
    if (s !== current) swap(s, s === a ? pair.i : pair.j, mid);
  }
  return true;
}
// The best filmed view of one object.
async function goToObject(item) {
  select(item.key);
  const C = V3(item.o.centre), pair = pickPair(current, current, C, reach(item.o.size));
  if (!pair) { note(`No filmed view shows this ${item.name} well`, 3000); return false; }
  if (!showObjects) toggleObjects();
  const ok = await travel(current, pair.i, aim({ p: rail.p[pair.i].clone(), q: rail.qRaw[pair.i].clone() }, C));
  if (ok) flash(item.key);
  return ok;
}
// Every change in turn, for recording the demo (?tour=changes). Any input stops it.
async function tour() {
  await ready;
  for (const c of data.changes ?? []) {
    const since = performance.now();
    if (!(await goToChange(c))) return;
    await sleep(800);
    if (lastInput > since) return;
  }
  if (data.changes?.length) note("That was every change", 4000);
}

const changes = data.changes ?? [];
if (changes.length) {
  const list = $("changes"), head = Object.assign(document.createElement("div"), { className: "head", textContent: "What changed" });
  list.hidden = false;
  list.append(head);
  if (changes.length > 1) button("Show all", { title: "Visit every change in turn" }, tour, head);
  for (const c of changes) row(list, c.id, CHANGE[c.type] ?? "#fff", [["id", c.id], ["", c.sentence]], () => goToChange(c));
}
const objectsEl = $("objects"), objectRows = objectsEl.querySelector("div");
function listObjects() {
  const items = objectsOf[current] ?? [];
  objectsEl.hidden = !items.length;
  objectsEl.querySelector("summary").textContent = `Objects (${items.length})`;
  objectRows.replaceChildren();
  for (const k of Object.keys(rows)) if (k.includes(":")) delete rows[k];
  const seen = {}, count = {};
  for (const it of items) count[it.name] = (count[it.name] ?? 0) + 1;
  for (const it of [...items].sort((a, b) => a.name.localeCompare(b.name))) {
    seen[it.name] = (seen[it.name] ?? 0) + 1;
    row(objectRows, it.key, it.colour, [["", it.name], ["n", count[it.name] > 1 ? `#${seen[it.name]}` : ""]], () => goToObject(it));
  }
}

// ---------------------------------------------------------------- text
const moveText = (d) => (d >= 1 ? `${d.toFixed(1)} m` : `${Math.round(d * 100)} cm`);
const part = (c) => {
  if (c.type !== "moved") return `${c.label} ${c.type}`;
  const d = V3(c.before.centre).distanceTo(V3(c.after.centre));
  return d < 0.05 ? `${c.label} turned in place` : `${c.label} moved ${moveText(d)}`;   // same spot: turned or shifted where it stands
};
const counts = names.map((n) => objectsOf[n].length);
const nObjects = counts.every((k) => k === counts[0]) ? `${counts[0]} objects`
  : names.map((n, i) => `${counts[i]} objects ${(LABEL[n] ?? n).toLowerCase()}`).join(", ");
$("name").textContent = names.length > 1 ? "What changed in the room" : "The room in 3D";
$("summary").textContent = changes.length
  ? `${changes.length} change${changes.length > 1 ? "s" : ""}: ${changes.map(part).join(", ")}`
  : names.length > 1 ? `No changes found${counts[0] || counts[1] ? ` · ${nObjects}` : ""}` : `${nObjects} found`;
$("how").textContent = names.length > 1
  ? "Both phone videos rebuilt as one shared 3D model. The camera follows the filmed path."
  : "The phone video rebuilt as a 3D model. The camera follows the filmed path.";

// ---------------------------------------------------------------- the real video, for comparison
const pip = $("pip"), pipImg = pip.querySelector("img"), pipCap = pip.querySelector("figcaption");
let pipOn = !!m.frames_dir && !matchMedia("(max-aspect-ratio: 1/1)").matches, lastFrame = -1;
function togglePip() {
  if (!m.frames_dir) return;
  pipOn = !pipOn;
  pip.style.display = pipOn ? "block" : "none";
  lastFrame = -1;
  document.querySelector("[data-pip]").setAttribute("aria-pressed", pipOn);
}
if (m.frames_dir) button("Video", { class: "toggle", "data-pip": "", "aria-pressed": pipOn, title: "The phone video frame nearest this view (V)" }, togglePip);
pip.style.display = pipOn ? "block" : "none";

// ---------------------------------------------------------------- loop
setState(current, true);
const dock = $("dock");
new ResizeObserver(() => document.documentElement.style.setProperty("--dock-h", `${dock.offsetHeight}px`)).observe(dock);
new ResizeObserver(() => {
  const w = stage.clientWidth, h = stage.clientHeight;
  fitView(w, h);
  camera.fov = view.fovY;
  camera.aspect = view.aspect;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}).observe(stage);
let lastNow = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.1, (now - lastNow) / 1000);
  lastNow = now;
  if (state.cut) runCut(now);
  const keyed = stepKeys(dt);
  if (state.ride) stepRide(now);
  else if (state.playing && !state.cut) playStep(dt);
  if (state.playing || state.ride || keyed) state.raw *= Math.exp(-dt / 0.3);  // steadied orientation while moving
  if (state.playing) state.wTo = 0;
  settle(dt, now);
  state.w += (state.wTo - state.w) * (1 - Math.exp(-dt / 0.15));
  if (!state.wTo && state.w < 1e-3) { state.w = 0; state.hold = null; }
  placeCamera();
  const r = rail, t0 = r.t[0], time = sToTime(r, state.s), f = clamp(Math.round(state.s), 0, r.last);
  scrub.value = Math.round(((time - t0) / Math.max(1e-6, r.t[r.last] - t0)) * 1000);
  clock.textContent = `${(time - t0).toFixed(1)} / ${(r.t[r.last] - t0).toFixed(1)} s`;
  if (pipOn && f !== lastFrame) {
    pipImg.src = `${m.frames_dir}/${r.cams[f].name}`;
    pipCap.textContent = `${names.length > 1 ? `${label(current)} video` : "Phone video"}, nearest frame (${r.t[f].toFixed(1)} s)`;
    lastFrame = f;
  }
  pulse(now);
  renderer.render(scene, camera);
  placeTags(now);
});
if (params.has("play")) setPlaying(true);
if (params.get("tour") === "changes") tour();
window.viewer = {
  camera, meshes, state, rails, view, data, tags, get current() { return current; },
  setPlaying, show, goToChange, goToObject, objectsOf, tour, bestView, sharedPairs, ready,
};
</script>
